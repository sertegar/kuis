<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kuis HOTS DKV: Teori Warna dan Filosofi Logo</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf9f5;--fg:#17171a;--card:#fff;--line:#dcdad2;--mute:#6b6a64;--c:#00aeef;--m:#ec008c;--y:#ffd500;--ok:#0a8f4e;--no:#d6204a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141417;--fg:#f1f0ea;--card:#1f1f24;--line:#33333a;--mute:#9d9c95;--ok:#3ddc8a;--no:#ff6b8b}}
:root[data-theme="dark"]{--bg:#141417;--fg:#f1f0ea;--card:#1f1f24;--line:#33333a;--mute:#9d9c95;--ok:#3ddc8a;--no:#ff6b8b}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.5 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:clamp(2rem,9vw,2.8rem);line-height:1.05;margin:8px 0 12px;font-weight:800;letter-spacing:-.02em}
.cmyk{display:flex;height:10px;border-radius:5px;overflow:hidden;margin-bottom:18px}
.cmyk i{flex:1}.cmyk i:nth-child(1){background:var(--c)}.cmyk i:nth-child(2){background:var(--m)}.cmyk i:nth-child(3){background:var(--y)}.cmyk i:nth-child(4){background:var(--fg)}
p{margin:0 0 12px}.mute{color:var(--mute);font-size:.92rem}
label{display:block;font-weight:600;margin:18px 0 6px}
input[type=text]{width:100%;padding:14px;font:inherit;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg)}
input[type=text]:focus,button:focus-visible{outline:3px solid var(--m);outline-offset:2px}
.btn{font:inherit;font-weight:600;border:0;border-radius:10px;padding:14px 18px;background:var(--fg);color:var(--bg);cursor:pointer;width:100%}
.btn.alt{background:transparent;color:var(--fg);border:2px solid var(--line)}
.btn:disabled{opacity:.35}
.row{display:flex;gap:10px;margin-top:16px}.row .btn{flex:1}
.bar{display:grid;grid-template-columns:repeat(20,1fr);gap:3px;margin:6px 0 14px}
.bar button{height:12px;border:0;padding:0;border-radius:3px;background:var(--line);cursor:pointer}
.bar button.cur{outline:2px solid var(--fg);outline-offset:1px}
.meta{display:flex;justify-content:space-between;font-size:.9rem;color:var(--mute)}
.q{font-size:1.12rem;font-weight:600;line-height:1.45;margin:10px 0 14px}
.opt{display:flex;gap:12px;width:100%;text-align:left;font:inherit;padding:13px 14px;margin-bottom:9px;background:var(--card);color:var(--fg);border:2px solid var(--line);border-radius:12px;cursor:pointer}
.opt b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:.85rem}
.opt.sel{border-color:var(--m)}.opt.sel b{background:var(--m);color:#fff}
.opt.right{border-color:var(--ok)}.opt.right b{background:var(--ok);color:#000}
.opt.wrong{border-color:var(--no)}.opt.wrong b{background:var(--no);color:#000}
.score{font-size:4.5rem;font-weight:800;line-height:1;margin:6px 0}
.rv{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.rv .e{font-size:.92rem;color:var(--mute);border-left:4px solid var(--y);padding-left:10px;margin-top:10px}
.rv .opt{cursor:default;padding:9px 12px;margin-bottom:6px;font-size:.95rem}
.tag{font-weight:600;font-size:.85rem}
.hide{display:none}
</style>
</head>
<body>
<main id="app"></main>
<script>
const Q=[
{q:"Desainer ingin poster dengan kontras kuat agar elemen utamanya langsung menonjol. Pasangan warna yang paling tepat adalah...",o:["Biru dan hijau","Biru dan oranye","Merah dan magenta","Kuning dan hijau kekuningan"],a:1,e:"Biru dan oranye berseberangan di roda warna (komplementer), sehingga menghasilkan kontras paling kuat."},
{q:"Brand spa ingin tampilan yang harmonis, menenangkan, dan tidak mencolok. Skema warna yang paling sesuai adalah...",o:["Triadik merah, kuning, biru dengan saturasi penuh","Komplementer merah dan hijau yang jenuh","Analogus dengan saturasi lembut, misalnya hijau, hijau kebiruan, dan biru","Hitam putih dengan aksen neon"],a:2,e:"Warna yang bersebelahan di roda warna terasa selaras, dan saturasi lembut memberi kesan tenang."},
{q:"Warna di layar HP tampak lebih cerah dan hidup daripada hasil cetaknya. Penjelasan teorinya adalah...",o:["Layar memancarkan cahaya (RGB, aditif), sedangkan cetak memantulkan cahaya dan menyerap sebagian (CMYK, subtraktif)","Kertas cetak selalu salah kalibrasi","Layar memakai tinta lebih banyak","Warna cetak tidak punya hue"],a:0,e:"Gamut RGB lebih luas daripada CMYK. Karena itu warna neon dan sangat jenuh sulit direproduksi di media cetak."},
{q:"Pada model HSB, desainer menurunkan saturation sebuah warna tanpa mengubah hue dan brightness. Hasilnya adalah...",o:["Warna menjadi lebih gelap","Warna berganti menjadi hue lain","Warna berubah menjadi putih","Warna tampak lebih pudar mendekati abu-abu, tetapi hue-nya tetap sama"],a:3,e:"Saturasi menunjukkan kemurnian warna. Semakin rendah, semakin mendekati abu-abu."},
{q:"Teks abu muda pada latar putih sulit dibaca. Solusi yang paling tepat menurut prinsip kontras dan aksesibilitas adalah...",o:["Menaikkan kontras luminansi teks terhadap latar (rasio minimal sekitar 4,5 banding 1)","Mengganti hue teks menjadi merah dengan kecerahan yang sama","Menambah efek bayangan tipis","Memperkecil ukuran teks"],a:0,e:"Keterbacaan ditentukan perbedaan terang-gelap (luminansi), bukan sekadar perbedaan hue."},
{q:"Banyak brand makanan cepat saji memakai merah dan kuning. Alasan psikologis yang paling masuk akal adalah...",o:["Keduanya warna paling murah untuk dicetak","Keduanya adalah warna netral","Merah dikaitkan dengan energi dan selera, kuning dengan perhatian dan keceriaan, sehingga cocok untuk keputusan cepat","Keduanya memberi kesan mewah dan eksklusif"],a:2,e:"Asosiasi warna memengaruhi emosi dan perilaku. Merah dan kuning mendorong energi, perhatian, dan nafsu makan."},
{q:"Sebuah brand akan masuk pasar internasional. Warna putih bermakna suci di satu negara, tetapi bermakna duka di negara lain. Langkah desainer yang paling tepat adalah...",o:["Memakai satu warna yang sama di semua negara tanpa riset","Meriset makna budaya warna di tiap pasar target lalu menyesuaikan penerapannya","Menghindari semua warna","Mengikuti selera pribadi desainer"],a:1,e:"Makna warna dipengaruhi budaya. Riset sebelum meluncur mencegah salah pesan."},
{q:"Pada aturan 60-30-10, tombol ajakan bertindak (CTA) pada sebuah antarmuka diberi warna aksen yang porsinya sekitar 10%. Alasannya adalah...",o:["Agar halaman tampak penuh warna","Agar seluruh elemen punya bobot yang sama","Agar warna dominan tidak perlu dipakai","Porsi kecil dengan warna kontras membuat elemen terpenting menonjol dan langsung menarik perhatian"],a:3,e:"Warna aksen yang jarang dipakai menjadi penunjuk perhatian. Jika dipakai di mana-mana, efeknya hilang."},
{q:"Sebuah kafe ingin suasana hangat dan akrab lewat identitas visualnya. Pilihan warna dominan yang paling sesuai adalah...",o:["Oranye, cokelat, dan kuning hangat dengan sedikit aksen warna dingin","Biru es, abu dingin, dan putih terang","Ungu dan hijau neon","Hitam dan perak metalik"],a:0,e:"Warna hangat memberi kesan akrab dan dekat. Aksen dingin sedikit menambah keseimbangan."},
{q:"Abu-abu yang sama tampak lebih terang di atas latar gelap dan lebih gelap di atas latar terang. Implikasi bagi desainer adalah...",o:["Persepsi warna tidak penting selama kode warnanya sama","Hanya terjadi pada layar lama","Warna dinilai dalam konteks sekitarnya, sehingga perlu diuji pada latar yang benar-benar dipakai","Latar harus selalu putih"],a:2,e:"Ini disebut kontras simultan. Warna yang sama bisa terlihat berbeda tergantung warna di sekelilingnya."},
{q:"Pada logo FedEx, ada panah tersembunyi di ruang antara huruf E dan x. Prinsip desain yang dipakai adalah...",o:["Gradasi warna","Ruang negatif (figure-ground), yaitu makna tambahan muncul dari ruang kosong tanpa menambah elemen","Bayangan tiga dimensi","Pengulangan pola"],a:1,e:"Ruang negatif membuat logo menyimpan makna kedua (kecepatan dan arah) sambil tetap sederhana."},
{q:"Sebuah komunitas ingin logo yang menyampaikan kebersamaan dan kesinambungan tanpa awal dan akhir. Bentuk dasar yang paling tepat adalah...",o:["Segitiga runcing ke atas","Persegi dengan sudut tajam","Garis zig-zag","Lingkaran, yang lazim diasosiasikan dengan kesatuan, komunitas, dan keabadian"],a:3,e:"Lingkaran tidak punya sudut dan tidak berujung, sehingga sering dimaknai sebagai kesatuan dan siklus."},
{q:"Sebuah startup punya nama sangat panjang, tetapi harus dikenali pada ikon aplikasi yang kecil. Pendekatan logo yang paling tepat adalah...",o:["Lettermark atau monogram dari inisial, dipadukan dengan wordmark penuh untuk versi besar","Menaruh nama lengkap dalam satu baris pada ikon","Memakai foto tim","Memakai ilustrasi detail dengan banyak elemen"],a:0,e:"Monogram ringkas dan terbaca pada ukuran kecil, sementara wordmark menjaga nama lengkap tetap dikenal."},
{q:"Seorang konsultan berpendapat bahwa logo tidak harus menggambarkan isi bisnis secara harfiah, misalnya toko roti tidak wajib memakai gambar roti. Alasan yang paling tepat adalah...",o:["Gambar harfiah selalu melanggar hak cipta","Logo hanya dibuat dari huruf","Logo berfungsi sebagai penanda yang maknanya dibangun lewat pengalaman konsisten pada brand, sehingga kekhasan lebih penting daripada ilustrasi literal","Logo tidak perlu dipikirkan, karena hanya hiasan"],a:2,e:"Makna logo tumbuh dari kualitas dan pengalaman terhadap brand. Simbol yang khas lebih mudah diingat daripada gambar yang generik."},
{q:"Sebuah bank lama merombak total logonya menjadi sangat modern. Nasabah lama justru kehilangan rasa percaya. Pendekatan rebranding yang lebih tepat adalah...",o:["Mengganti total agar terlihat baru","Evolusi bertahap: mempertahankan ekuitas visual seperti warna atau bentuk kunci, lalu menyederhanakannya","Tidak pernah mengubah logo selamanya","Mengganti nama bank saja"],a:1,e:"Ekuitas visual adalah modal pengenalan brand. Perubahan bertahap menjaga kepercayaan sambil tetap menyegarkan tampilan."},
{q:"Logo dengan tujuh warna gradasi menjadi tidak terbaca saat difotokopi hitam putih. Prinsip logo yang dilanggar adalah...",o:["Orisinalitas","Keterbacaan huruf","Kesesuaian dengan target pasar","Fleksibilitas (versatility): logo harus tetap efektif dalam versi satu warna atau hitam putih"],a:3,e:"Logo yang baik diuji pada berbagai media dan harus tetap berfungsi tanpa warna penuh."},
{q:"Logo rumah sakit memakai merah menyala dan bentuk-bentuk runcing, sehingga pasien merasa cemas. Evaluasi yang paling tepat adalah...",o:["Karakter visual tidak sesuai dengan nilai brand (kenyamanan dan kepercayaan); sebaiknya pakai warna lembut dan bentuk membulat","Logo sudah tepat karena menarik perhatian","Masalahnya hanya pada ukuran logo","Cukup mengganti font menjadi lebih tebal"],a:0,e:"Logo harus sesuai (appropriate) dengan karakter dan nilai yang diwakilinya. Warna dan bentuk memengaruhi rasa yang muncul."},
{q:"Sebuah komunitas batik ingin logo yang membawa filosofi budaya lokal. Pendekatan yang paling etis dan tepat adalah...",o:["Menyalin motif tradisional tanpa mengubah apa pun","Memakai motif sakral agar terlihat berwibawa","Meriset makna motif, melibatkan komunitas, dan menyederhanakannya tanpa menghilangkan makna","Memilih motif secara acak yang paling cantik"],a:2,e:"Simbol budaya punya makna dan konteks. Riset dan keterlibatan pemilik budaya menjaga logo tetap hormat dan bermakna."},
{q:"Klien menganggap logo baru otomatis menyelesaikan seluruh citra brand-nya. Tanggapan desainer yang paling tepat adalah...",o:["Setuju, karena logo adalah satu-satunya elemen brand","Menjelaskan bahwa logo hanya satu elemen; identitas visual membutuhkan sistem warna, tipografi, gaya komunikasi, dan penerapan yang konsisten","Menolak mengerjakan proyek","Menyarankan mengganti logo setiap bulan"],a:1,e:"Citra brand dibangun dari keseluruhan sistem identitas yang konsisten, bukan dari logo saja."},
{q:"Sebuah kantor hukum ingin logo berbasis teks (wordmark) yang menyampaikan kesan kokoh, formal, dan tepercaya. Pilihan huruf dan warna yang paling sesuai adalah...",o:["Huruf script dekoratif dengan warna pink","Huruf bergaya grafiti dengan warna neon","Huruf berbentuk gelembung dengan warna pastel","Huruf serif tegas atau sans-serif geometris tebal dengan biru tua atau hitam"],a:3,e:"Bentuk huruf dan warna membawa kepribadian. Serif tegas dan biru tua dikaitkan dengan otoritas dan kepercayaan."}
];
const L="ABCD",app=document.getElementById("app");
let name="",i=0,ans=Array(Q.length).fill(-1),done=false;
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const strip='<div class="cmyk"><i></i><i></i><i></i><i></i></div>';
const COL=["var(--c)","var(--m)","var(--y)","var(--fg)"];
const answered=()=>ans.filter(x=>x>=0).length;
function start(){
  app.innerHTML=strip+`<h1>Teori Warna &amp; Filosofi Logo</h1>
  <p>Kuis HOTS persiapan TKA SMK DKV kelas 12.</p>
  <p class="mute">20 soal pilihan ganda. Soal menuntut analisis dan pengambilan keputusan, bukan hafalan. Jawaban bisa diubah sebelum dikumpulkan.</p>
  <label for="n">Nama lengkap</label>
  <input id="n" type="text" autocomplete="name" placeholder="Tulis namamu di sini">
  <div class="row"><button class="btn" id="go" disabled>Mulai kuis</button></div>`;
  const n=document.getElementById("n"),g=document.getElementById("go");
  n.oninput=()=>{g.disabled=n.value.trim().length<2};
  g.onclick=()=>{name=n.value.trim();i=0;quiz()};
  n.onkeydown=e=>{if(e.key==="Enter"&&!g.disabled)g.click()};
}
function quiz(){
  const q=Q[i];
  const bar=Q.map((_,k)=>`<button aria-label="Soal ${k+1}" data-k="${k}" class="${k===i?"cur":""}" style="${ans[k]>=0?"background:"+COL[k%4]:""}"></button>`).join("");
  app.innerHTML=strip+`<div class="meta"><span>${esc(name)}</span><span>Terjawab ${answered()}/${Q.length}</span></div>
  <div class="bar">${bar}</div>
  <div class="meta"><span>Soal ${i+1} dari ${Q.length}</span></div>
  <p class="q">${q.q}</p>
  ${q.o.map((t,k)=>`<button class="opt ${ans[i]===k?"sel":""}" data-o="${k}"><b>${L[k]}</b><span>${t}</span></button>`).join("")}
  <div class="row"><button class="btn alt" id="pv" ${i===0?"disabled":""}>Sebelumnya</button>
  ${i<Q.length-1?'<button class="btn" id="nx">Berikutnya</button>':'<button class="btn" id="fin">Kumpulkan</button>'}</div>`;
  app.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{ans[i]=+b.dataset.o;quiz()});
  app.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{i=+b.dataset.k;quiz()});
  document.getElementById("pv").onclick=()=>{i--;quiz();scrollTo(0,0)};
  const nx=document.getElementById("nx");if(nx)nx.onclick=()=>{i++;quiz();scrollTo(0,0)};
  const f=document.getElementById("fin");if(f)f.onclick=()=>{
    const left=Q.length-answered();
    if(left>0&&!confirm(left+" soal belum dijawab. Tetap kumpulkan?"))return;
    result();scrollTo(0,0)};
}
function result(){
  const s=ans.reduce((t,x,k)=>t+(x===Q[k].a?1:0),0),nilai=s*5;
  const msg=nilai>=80?"Kamu sudah siap. Pertahankan dan tetap latihan.":nilai>=60?"Cukup baik. Pelajari lagi soal yang salah di bawah.":"Masih perlu belajar. Baca pembahasan di bawah lalu coba lagi.";
  const rv=Q.map((q,k)=>{
    const ok=ans[k]===q.a;
    return `<div class="rv"><span class="tag" style="color:var(${ok?"--ok":"--no"})">${ok?"Benar":ans[k]<0?"Tidak dijawab":"Salah"}</span> &middot; Soal ${k+1}
    <p class="q" style="font-size:1rem;margin:6px 0 10px">${q.q}</p>
    ${q.o.map((t,j)=>`<div class="opt ${j===q.a?"right":j===ans[k]?"wrong":""}"><b>${L[j]}</b><span>${t}</span></div>`).join("")}
    <div class="e">${q.e}</div></div>`}).join("");
  app.innerHTML=strip+`<p class="mute">${esc(name)}</p><h1>Hasil kuis</h1>
  <div class="score">${nilai}</div>
  <p><b>${s} dari ${Q.length}</b> soal benar. ${msg}</p>
  <div class="row"><button class="btn" id="cp">Salin hasil</button><button class="btn alt" id="rt">Ulangi</button></div>
  <p class="mute" id="cm" style="margin-top:10px">Tunjukkan layar ini atau kirim hasil salinan ke gurumu.</p>
  <h2 style="margin:26px 0 12px;font-size:1.3rem">Pembahasan</h2>${rv}`;
  document.getElementById("rt").onclick=()=>{ans.fill(-1);i=0;start()};
  document.getElementById("cp").onclick=async()=>{
    const t=`Kuis HOTS DKV: Teori Warna dan Filosofi Logo\nNama: ${name}\nNilai: ${nilai} (${s}/${Q.length} benar)\nJawaban: ${ans.map((x,k)=>(k+1)+(x>=0?L[x]:"-")).join(" ")}`;
    try{await navigator.clipboard.writeText(t);document.getElementById("cm").textContent="Hasil tersalin. Tempel di chat gurumu."}
    catch(e){document.getElementById("cm").textContent="Gagal menyalin. Screenshot layar ini saja."}
  };
}
start();
</script>
</body>
</html>
